name: Example

on: push

permissions: {}

concurrency:
  group: env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first:
    name: Step one
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          show-progress: false
