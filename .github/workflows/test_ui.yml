name: UI Unit Tests

on:
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/test_ui.yml"

jobs:
  checks:
    runs-on: artemis-ui-test-runner-4
    permissions:
      contents: read
    env:
      UI_PATH: ./ui
      HADOLINT_URL: https://github.com/hadolint/hadolint/releases/download/v2.10.0/hadolint-Linux-x86_64
      NPM_VERSION: 10

    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2

      - name: Setup node from node version file
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # actions/setup-node@v6.2.0
        with:
          node-version-file: "${{ env.UI_PATH }}/.nvmrc"
          cache: npm
          cache-dependency-path: "${{ env.UI_PATH }}/package-lock.json"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # hashicorp/setup-terraform@v3.1.2

      - name: Set up the npm version
        run: npm install --global npm@$NPM_VERSION

      - name: Install npm packages
        run: make -C $UI_PATH install

      - name: Install hadolinter and check sha
        run: wget --quiet -O ./hadolint $HADOLINT_URL && sha512sum -c hadolint.sha512 && chmod 0766 ./hadolint
        working-directory: ${{ env.UI_PATH }}

      - name: Install shfmt
        run: |
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Run precommit checks (linting & testing etc)
        run: make -C $UI_PATH lint check audit

  tests:
    runs-on: artemis-ui-test-runner-4
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    env:
      UI_PATH: ./ui
      NPM_VERSION: 10
    steps:
      - name: Checkout the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4.2.2

      - name: Setup node from node version file
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4.4.0
        with:
          node-version-file: "${{ env.UI_PATH }}/.nvmrc"
          cache: npm
          cache-dependency-path: "${{ env.UI_PATH }}/package-lock.json"

      - name: Set up the npm version
        run: npm install --global npm@$NPM_VERSION

      - name: Install npm packages
        run: make -C $UI_PATH install

      - name: Run tests
        run: make -C $UI_PATH test JESTFLAGS="--shard=${{ matrix.shard }}/${{ strategy.job-total }}"

      - name: Save test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: ui-test-${{ matrix.shard }}
          path: ui/test-report/index.html
