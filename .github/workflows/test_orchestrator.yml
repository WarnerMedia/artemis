name: Orchestrator Unit Tests

on:
  pull_request:
    paths:
      - "orchestrator/**"
      - ".github/workflows/test_orchestrator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
      - name: setup python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Setup UV
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10
        with:
          enable-cache: true
          cache-dependency-glob: "orchestrator/uv.lock"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # hashicorp/setup-terraform@v3.1.2
      - name: Install shfmt
        run: |
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: Run code style tests
        run: make -C orchestrator style-test ENV=example
      - name: Run orchestrator tests
        run: |
          make -C orchestrator unit-test ENV=example PYTEST_EXTRA_ARGS='--cov-report=term-missing'
